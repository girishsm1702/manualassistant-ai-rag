# Optional PostgreSQL + pgvector for later production use.
# This laptop currently runs SQLite. Start this only if Docker is installed:
#   docker compose up -d
#   set DATABASE_URL=postgresql://manuals:manuals@127.0.0.1:5432/manuals
#   python manage.py migrate

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: manuals
      POSTGRES_USER: manuals
      POSTGRES_PASSWORD: manuals
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
